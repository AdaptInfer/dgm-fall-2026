<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>

  <!-- Folded RNN -->
  <text x="95" y="24" text-anchor="middle" font-weight="bold">Folded</text>
  <rect x="60" y="40" width="70" height="40" rx="8" fill="#cfe5c4" stroke="#333"/>
  <text x="95" y="66" text-anchor="middle" font-style="italic">y<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <ellipse cx="95" cy="160" rx="38" ry="24" fill="#fbd49c" stroke="#333"/>
  <text x="95" y="166" text-anchor="middle" font-style="italic">h<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <rect x="60" y="240" width="70" height="40" rx="8" fill="#c6d6f3" stroke="#333"/>
  <text x="95" y="266" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <line x1="95" y1="240" x2="95" y2="186" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="95" y1="136" x2="95" y2="82" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M131,150 C185,120 185,200 132,172" fill="none" stroke="#b03030" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="178" y="165" fill="#b03030" font-style="italic">W<tspan baseline-shift="sub" font-size="11">hh</tspan></text>
  <text x="102" y="216" font-style="italic" font-size="13">W<tspan baseline-shift="sub" font-size="10">hx</tspan></text>
  <text x="102" y="114" font-style="italic" font-size="13">W<tspan baseline-shift="sub" font-size="10">yh</tspan></text>

  <!-- arrow "unfold" -->
  <path d="M225,150 L280,150 L280,135 L310,160 L280,185 L280,170 L225,170 z" fill="#eeeeee" stroke="#666"/>
  <text x="267" y="210" text-anchor="middle" font-style="italic" fill="#555">unfold</text>

  <!-- Unrolled -->
  <text x="590" y="24" text-anchor="middle" font-weight="bold">Unrolled over time (same weights at every step)</text>
  <!-- h0 -->
  <text x="352" y="166" text-anchor="middle" font-style="italic">h<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <g>
    <!-- step 1 -->
    <rect x="395" y="40" width="70" height="40" rx="8" fill="#cfe5c4" stroke="#333"/>
    <text x="430" y="66" text-anchor="middle" font-style="italic">y<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <ellipse cx="430" cy="160" rx="38" ry="24" fill="#fbd49c" stroke="#333"/>
    <text x="430" y="166" text-anchor="middle" font-style="italic">h<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <rect x="395" y="240" width="70" height="40" rx="8" fill="#c6d6f3" stroke="#333"/>
    <text x="430" y="266" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <!-- step 2 -->
    <rect x="555" y="40" width="70" height="40" rx="8" fill="#cfe5c4" stroke="#333"/>
    <text x="590" y="66" text-anchor="middle" font-style="italic">y<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <ellipse cx="590" cy="160" rx="38" ry="24" fill="#fbd49c" stroke="#333"/>
    <text x="590" y="166" text-anchor="middle" font-style="italic">h<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <rect x="555" y="240" width="70" height="40" rx="8" fill="#c6d6f3" stroke="#333"/>
    <text x="590" y="266" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <!-- step 3 -->
    <rect x="715" y="40" width="70" height="40" rx="8" fill="#cfe5c4" stroke="#333"/>
    <text x="750" y="66" text-anchor="middle" font-style="italic">y<tspan baseline-shift="sub" font-size="11">3</tspan></text>
    <ellipse cx="750" cy="160" rx="38" ry="24" fill="#fbd49c" stroke="#333"/>
    <text x="750" y="166" text-anchor="middle" font-style="italic">h<tspan baseline-shift="sub" font-size="11">3</tspan></text>
    <rect x="715" y="240" width="70" height="40" rx="8" fill="#c6d6f3" stroke="#333"/>
    <text x="750" y="266" text-anchor="middle" font-style="italic">x<tspan baseline-shift="sub" font-size="11">3</tspan></text>
  </g>
  <!-- vertical arrows -->
  <g stroke="#444" stroke-width="1.6">
    <line x1="430" y1="240" x2="430" y2="186" marker-end="url(#a)"/>
    <line x1="590" y1="240" x2="590" y2="186" marker-end="url(#a)"/>
    <line x1="750" y1="240" x2="750" y2="186" marker-end="url(#a)"/>
    <line x1="430" y1="136" x2="430" y2="82" marker-end="url(#a)"/>
    <line x1="590" y1="136" x2="590" y2="82" marker-end="url(#a)"/>
    <line x1="750" y1="136" x2="750" y2="82" marker-end="url(#a)"/>
  </g>
  <!-- recurrent arrows -->
  <g stroke="#b03030" stroke-width="1.8">
    <line x1="366" y1="160" x2="390" y2="160" marker-end="url(#a)"/>
    <line x1="468" y1="160" x2="550" y2="160" marker-end="url(#a)"/>
    <line x1="628" y1="160" x2="710" y2="160" marker-end="url(#a)"/>
    <line x1="788" y1="160" x2="822" y2="160" marker-end="url(#a)"/>
  </g>
  <g fill="#b03030" font-style="italic" font-size="13" text-anchor="middle">
    <text x="509" y="150">W<tspan baseline-shift="sub" font-size="10">hh</tspan></text>
    <text x="669" y="150">W<tspan baseline-shift="sub" font-size="10">hh</tspan></text>
  </g>
  <g font-style="italic" font-size="13">
    <text x="437" y="216">W<tspan baseline-shift="sub" font-size="10">hx</tspan></text>
    <text x="597" y="216">W<tspan baseline-shift="sub" font-size="10">hx</tspan></text>
    <text x="757" y="216">W<tspan baseline-shift="sub" font-size="10">hx</tspan></text>
    <text x="437" y="114">W<tspan baseline-shift="sub" font-size="10">yh</tspan></text>
    <text x="597" y="114">W<tspan baseline-shift="sub" font-size="10">yh</tspan></text>
    <text x="757" y="114">W<tspan baseline-shift="sub" font-size="10">yh</tspan></text>
  </g>
  <text x="828" y="166" font-size="18" fill="#666">…</text>
  <text x="590" y="315" text-anchor="middle" fill="#555" font-size="13">Each hidden unit receives two inputs: the current x<tspan baseline-shift="sub" font-size="10">t</tspan> and the previous state h<tspan baseline-shift="sub" font-size="10">t−1</tspan>.</text>
</svg>
